name: Release

# Push a tag `v0.1.0` that matches the version in package.json and in packages/create-nanoeffects:
# the workflow checks everything, publishes both packages to npm (nanoeffects first, because the
# project that create-nanoeffects makes depends on it) and creates the GitHub release with the notes
# of that version from CHANGELOG.md
# (scripts/release-notes.mjs: the section, absolute links, and the link to the changes since the version before).
# npm trusted publishing: on npmjs.com, Settings > Trusted Publisher of the package, add this
# repository and the workflow file `release.yml`, for nanoeffects and for create-nanoeffects.
# No token is stored here.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # v6, not v7: v7 stops exporting the dummy NODE_AUTH_TOKEN, which the publish below has run with;
      # change it when a release can be watched
      - uses: actions/setup-node@v6
        with:
          node-version: 24 # npm 11.5.1 or newer is needed for trusted publishing
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The tag matches the version of both packages
        run: |
          version="$(node -p "require('./package.json').version")"
          starter="$(node -p "require('./packages/create-nanoeffects/package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }
          test "$starter" = "$version" || { echo "nanoeffects $version, create-nanoeffects $starter"; exit 1; }

      - name: The changelog has notes for this version
        run: grep -q "^## ${GITHUB_REF_NAME#v}$" CHANGELOG.md

      # verify runs the DevTools playground in a real Chromium
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm verify
      - run: pnpm smoke

      - run: npm publish --provenance --access public

      # after nanoeffects: the project it makes asks npm for this version of nanoeffects
      - run: npm publish --provenance --access public
        working-directory: packages/create-nanoeffects

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
